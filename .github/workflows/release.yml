name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip
        run: |
          git archive --format=zip --prefix=joplin-clipper/ -o "joplin-clipper-${GITHUB_REF_NAME}.zip" HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: joplin-clipper-${{ github.ref_name }}.zip
          generate_release_notes: true
