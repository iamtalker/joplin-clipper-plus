name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only the files the extension needs, manifest.json at the zip root —
      # the same file works for the Chrome Web Store upload and for
      # "Load unpacked" after unzipping.
      - name: Build extension zip
        run: |
          bash scripts/make-store-zip.sh dist
          cp dist/joplin-clipper-plus-store-*.zip "joplin-clipper-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: joplin-clipper-${{ github.ref_name }}.zip
          generate_release_notes: true
